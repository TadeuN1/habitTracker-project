<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Roboto+Mono:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Daily | Habit tracking</title>
    <meta name="description" content="App to track daily habits with check-in and local persistence.">
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml">

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
      <header>
       <img src="./assets/logo.svg" alt="Habits app logo">
      <button type="button">
      <img src="./assets/plus.svg" alt="Plus sign icon">
      <span>Log my day</span>
      </button> 

      </header> 
<form id= "form-habits">
  <div class= "habits">
    <div class="habit" data-name="run">🏃‍♂️</div>
    <div class="habit" data-name="water">💧</div>
    <div class="habit" data-name="food">🍎</div>
    <div class="habit" data-name="pills">💊</div>
    <div class="habit" data-name="exercise">🤸‍♀️</div>
  </div>
    <div class="days"></div>
  </form>
  <script src="https://cdn.jsdelivr.net/gh/maykbrito/libs/NLWSetup/source/NLWSetup.js"></script>
  <script src="script.js"></script>
    </body>
</html>
